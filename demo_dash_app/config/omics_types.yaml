      - fastq
      - metadata
    workflows:
      - reference_only
      - fastq_qc
      - trim_only
      - post_trim_qc_only
      - strandedness_only
      - salmon_quant_only
      - star_align_only
      - hisat2_align_only
      - qc_trim
      - qc_trim_strandedness
      - salmon_count_matrix
      - star_count_matrix
      - hisat2_alignment_route
      - hisat2_featurecounts_route
      - hisat2_htseq_route
      - star_htseq_route
      - downstream_merge_featurecounts
      - downstream_validate_inputs
      - downstream_filter_low_expression
      - downstream_normalize_transform
      - downstream_pca
      - downstream_umap
      - downstream_differential_expression
      - downstream_plsda
      - downstream_go_enrichment
      - downstream_pathway_enrichment
      - downstream_ranked_gsea
      - downstream_airway_all_atomics
      - downstream_custom_all_atomics
