        allowed: [20, 25, 30, 50]
        labels:
          20: 20 bp recommended
          25: 25 bp
          30: 30 bp
          50: 50 bp
        min: 10
        max: 100
        ui_label: Minimum read length after trimming
        help: Reads shorter than this after trimming are discarded.
      trim_poly_g:
        type: enum
        default: auto
        allowed: [auto, true, false]
        labels:
          auto: Auto recommended
          true: On
          false: Off
        ui_label: Trim polyG tails
        help: Auto is recommended for NextSeq/NovaSeq two-color data.
    advanced_params:
      trimming_tool:
        type: enum
        default: fastp
        allowed: [fastp, cutadapt]
        labels:
          fastp: fastp recommended
          cutadapt: Cutadapt advanced
        ui_label: Trimming tool
        help: Use fastp by default. Use Cutadapt only for exact adapter handling.
      trim_poly_x:
        type: enum
        default: false
        allowed: [false, true]
        labels:
          false: Off recommended
          true: On
        ui_label: Trim polyX tails
      adapter_sequence_r1:
        type: string
        default:
        ui_label: R1 adapter sequence
      adapter_sequence_r2:
        type: string
        default:
        ui_label: R2 adapter sequence
      adapter_fasta:
        type: string
        default:
