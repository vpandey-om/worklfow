  - id: downstream_umap
    name: "Atomic DS 06 - UMAP CSV outputs"
    label: "Atomic DS 06 - UMAP CSV outputs"
    omics_type: bulk_rnaseq
    enabled: true
    description: Compute UMAP coordinate CSV outputs from transformed expression.
    downstream: true
    downstream_atomic: umap
    selected_steps: [downstream_umap]

  - id: downstream_differential_expression
    name: "Atomic DS 07 - Differential expression CSV outputs"
    label: "Atomic DS 07 - Differential expression CSV outputs"
    omics_type: bulk_rnaseq
    enabled: true
    description: Produce DESeq2-compatible differential-expression CSV contracts using current CLI fallback.
    downstream: true
    downstream_atomic: differential-expression
    selected_steps: [downstream_differential_expression]

  - id: downstream_plsda
    name: "Atomic DS 08 - PLS-DA CSV outputs"
    label: "Atomic DS 08 - PLS-DA CSV outputs"
    omics_type: bulk_rnaseq
    enabled: true
    description: Compute exploratory PLS-DA CSV outputs. No plots are generated.
    downstream: true
    downstream_atomic: plsda
    selected_steps: [downstream_plsda]

  - id: downstream_go_enrichment
    name: "Atomic DS 10 - GO enrichment CSV outputs"
    label: "Atomic DS 10 - GO enrichment CSV outputs"
    omics_type: bulk_rnaseq
    enabled: true
    description: Run local GMT-based GO-style overrepresentation and write CSV/JSON outputs.
    downstream: true
    downstream_atomic: go-enrichment
    selected_steps: [downstream_go_enrichment]

  - id: downstream_pathway_enrichment
    name: "Atomic DS 11 - Pathway enrichment CSV outputs"
    label: "Atomic DS 11 - Pathway enrichment CSV outputs"
    omics_type: bulk_rnaseq
    enabled: true
    description: Run local GMT-based pathway overrepresentation and write CSV/JSON outputs.
    downstream: true
    downstream_atomic: pathway-enrichment
    selected_steps: [downstream_pathway_enrichment]

  - id: downstream_ranked_gsea
    name: "Atomic DS 12 - Ranked GSEA CSV outputs"
    label: "Atomic DS 12 - Ranked GSEA CSV outputs"
    omics_type: bulk_rnaseq
    enabled: true
    description: Run local ranked gene-set scoring and write GSEA CSV/JSON outputs.
    downstream: true
    downstream_atomic: gsea
    selected_steps: [downstream_ranked_gsea]

  - id: downstream_airway_all_atomics
    name: "Downstream demo - Airway count matrix"
    label: "Downstream demo - Airway count matrix"
    omics_type: bulk_rnaseq
    enabled: true
    description: Run all implemented downstream RNA-seq atomic steps on the bundled airway count matrix and produce CSV/JSON outputs only.
    downstream: true
    selected_steps:
      - downstream_merge_featurecounts
      - downstream_validate_inputs
      - downstream_filter_low_expression
      - downstream_normalize_transform
      - downstream_pca
      - downstream_umap
      - downstream_differential_expression
      - downstream_plsda
      - downstream_go_enrichment
      - downstream_pathway_enrichment
      - downstream_ranked_gsea

  - id: downstream_custom_all_atomics
    name: "Downstream custom - Count matrix CSV outputs"
    label: "Downstream custom - Count matrix CSV outputs"
    omics_type: bulk_rnaseq
    enabled: true
    description: Run all implemented downstream RNA-seq atomic steps using selected or path-provided count matrix, sample metadata, and contrasts. Outputs are CSV/JSON only.
    downstream: true
    selected_steps:
      - downstream_merge_featurecounts
      - downstream_validate_inputs
      - downstream_filter_low_expression
      - downstream_normalize_transform
      - downstream_pca
      - downstream_umap
      - downstream_differential_expression
      - downstream_plsda
      - downstream_go_enrichment
      - downstream_pathway_enrichment
      - downstream_ranked_gsea

  - id: reference_only
    name: "Atomic 01 - Build/Validate Reference"
    label: "Atomic 01 - Build/Validate Reference"
    omics_type: bulk_rnaseq
    enabled: true
    description: Validate a demo, existing, or custom RNA-seq reference bundle without running FASTQ processing.
    selected_steps:
      - rnaseq_06a_reference_build_validation
    params:
      reference_mode:
        type: enum
        default: demo_reference
        allowed: [demo_reference, prebuilt_reference, custom_reference]
      selected_route:
        type: enum
        default: salmon
        allowed: [salmon, star, custom]

  - id: fastq_qc
    name: "Atomic 02 - Raw FASTQ QC"
    label: "Atomic 02 - Raw FASTQ QC"
    omics_type: bulk_rnaseq
    enabled: true
    description: Run FastQC on uploaded FASTQ files using the existing SurvOm modular workflow.
    selected_steps:
      - rnaseq_03_raw_read_qc
    params:
      threads:
        type: int
        default: 4
      qc_tool:
        type: string
        default: fastqc

  - id: trim_only
    name: "Atomic 03 - Adapter/quality trimming"
    label: "Atomic 03 - Adapter/quality trimming"
    omics_type: bulk_rnaseq
    enabled: true
    description: Run fastp trimming only, using uploaded FASTQ files as input.
    selected_steps:
      - rnaseq_04_adapter_quality_trimming
    params:
      quality_threshold:
        type: enum
        default: 20
        allowed: [15, 20, 25, 30]
        labels:
          15: Q15
          20: Q20 recommended
          25: Q25
          30: Q30
        min: 5
        max: 35
        ui_label: Minimum base quality
        help: Q20 is a common RNA-seq default.
      minimum_read_length:
        type: enum
        default: 20
        allowed: [20, 25, 30, 50]
        labels:
          20: 20 bp recommended
          25: 25 bp
          30: 30 bp
          50: 50 bp
        min: 10
        max: 100
        ui_label: Minimum read length after trimming
        help: Reads shorter than this after trimming are discarded.
      trim_poly_g:
        type: enum
        default: auto
        allowed: [auto, true, false]
        labels:
          auto: Auto recommended
          true: On
          false: Off
        ui_label: Trim polyG tails
        help: Auto is recommended for NextSeq/NovaSeq two-color data.
    advanced_params:
      trimming_tool:
        type: enum
        default: fastp
        allowed: [fastp, cutadapt]
        labels:
          fastp: fastp recommended
          cutadapt: Cutadapt advanced
        ui_label: Trimming tool
        help: Use fastp by default. Use Cutadapt only for exact adapter handling.
      trim_poly_x:
        type: enum
        default: false
        allowed: [false, true]
        labels:
          false: Off recommended
          true: On
        ui_label: Trim polyX tails
      adapter_sequence_r1:
        type: string
        default:
        ui_label: R1 adapter sequence
      adapter_sequence_r2:
        type: string
        default:
        ui_label: R2 adapter sequence
      adapter_fasta:
        type: string
        default:
        ui_label: Adapter FASTA file
      trim_front_r1:
        type: int
        default: 0
        min: 0
        max: 50
        ui_label: Fixed 5 prime trim from R1
      trim_front_r2:
        type: int
        default: 0
        min: 0
        max: 50
        ui_label: Fixed 5 prime trim from R2
      cutadapt_error_rate:
        type: number
        default: 0.1
        min: 0
        max: 0.3
        ui_label: Cutadapt adapter error rate
      cutadapt_minimum_overlap:
        type: int
        default: 3
        min: 1
        max: 20
        ui_label: Cutadapt minimum adapter overlap

