    description: Validate counts, sample metadata, and contrasts for downstream analysis.
    downstream: true
    downstream_atomic: validate
    selected_steps: [downstream_validate_inputs]

  - id: downstream_filter_low_expression
    name: "Atomic DS 03 - Filter low-expression genes"
    label: "Atomic DS 03 - Filter low-expression genes"
