  - id: downstream_pca
    name: "Atomic DS 05 - PCA CSV outputs"
    label: "Atomic DS 05 - PCA CSV outputs"
    omics_type: bulk_rnaseq
    enabled: true
    description: Compute PCA scores/loadings/variance CSV files from transformed expression.
    downstream: true
    downstream_atomic: pca
