version: "1.0"
steps:
  rnaseq_03_raw_read_qc:
    step_id: rnaseq_03_raw_read_qc
    step_name: Raw Read Quality Control
    category: COMMON
    omics: [rnaseq, genomics, atacseq, chipseq, methylation]
    purpose: Assess sequencing quality before modifying reads.
    module_path: modules/common/fastqc/main.nf
    process_name: FASTQC
    default_tool: fastqc
    fallback_tool: falco
    can_run_individually: true
    can_be_skipped: false
    depends_on:
      - rnaseq_02_fastq_staging_integrity
    optional_depends_on: []
    compatible_previous_outputs:
      - staged_fastq_manifest
      - fastq_manifest
      - raw_fastq_files
    required_inputs:
      - name: fastq_manifest
        type: manifest
        formats: [csv, tsv, json]
        required: true
      - name: fastq_1
        type: file
        formats: [fastq, fastq.gz, fq, fq.gz]
        required: true
      - name: fastq_2
        type: file
        formats: [fastq, fastq.gz, fq, fq.gz]
        required_when: library_layout == paired
    outputs:
      - name: fastqc_html
        type: file
        pattern: "03_raw_qc/fastqc/*_fastqc.html"
        ui_visible: true
      - name: fastqc_zip
        type: file
        pattern: "03_raw_qc/fastqc/*_fastqc.zip"
        ui_visible: true
      - name: raw_qc_manifest
        type: tsv
        pattern: "03_raw_qc/fastqc/*.raw_qc_manifest.tsv"
        ui_visible: true
    parameters:
      run_raw_qc:
        type: boolean
        default: true
        exposure: user
        ui_label: Run raw read QC
      qc_tool:
        type: enum
        choices: [fastqc, falco]
        default: fastqc
        exposure: expert
        ui_label: QC tool
      threads:
        type: integer
        default: 4
        min: 1
        max: 32
        exposure: internal
      custom_adapters:
        type: file
        default: null
        exposure: expert
      custom_contaminants:
        type: file
        default: null
        exposure: expert
    next_steps:
      recommended:
        - rnaseq_04_adapter_quality_trimming
      allowed:
        - rnaseq_04_adapter_quality_trimming
        - rnaseq_07_salmon_quantification
        - rnaseq_09_star_alignment
    resources:
      cpus: 4
      memory: 8.GB
      time: 2.h
    containers:
      fastqc: quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0
      falco: quay.io/biocontainers/falco:1.3.2--h077b44d_0
    ui:
      card_title: Check raw FASTQ quality
      card_description: Detect adapter contamination, low-quality cycles, GC bias, duplication, and overrepresented sequences.
      mode: automated
      expose_in_guided: true
    chat_guidance:
      beginner: "I will check the raw FASTQ quality first using FastQC."
      expert: "Use Falco only for large cohorts or speed-sensitive runs."

  lcms_S1_initialize_project:
    step_id: lcms_S1_initialize_project
    step_name: Initialize LC-MS Project
    category: MASS_SPEC_COMMON
    omics: [lcms, metabolomics]
    purpose: Create run manifest, resolved config, software version, and checksum records for LC-MS intake.
    module_path: modules/common/initialize_project/main.nf
    process_name: INITIALIZE_PROJECT
    default_tool: python
    fallback_tool: null
    can_run_individually: true
    can_be_skipped: false
    depends_on: []
    optional_depends_on: []
    compatible_previous_outputs: [lcms_sample_sheet]
    required_inputs:
      - name: sample_sheet
        type: manifest
        formats: [csv, tsv]
        required: true
    outputs:
      - name: run_manifest
        type: json
        pattern: "S1_initialize_project/run_manifest.json"
        ui_visible: true
      - name: artifact_manifest
        type: json
        pattern: "S1_initialize_project/artifact_manifest.json"
        ui_visible: true
    parameters:
      run_scope:
        type: enum
        choices: [module, range, full]
        default: module
        exposure: user
        ui_label: Run scope
    next_steps:
      recommended: [lcms_S2_validate_sample_sheet]
      allowed: [lcms_S2_validate_sample_sheet]
    resources:
      cpus: 1
      memory: 2.GB
      time: 15.m
    containers:
      python: survom/lcms-core:module1-pending
    ui:
      card_title: Initialize LC-MS run
      card_description: Save run-level provenance before LC-MS intake.
      mode: automated
      expose_in_guided: true
    chat_guidance:
      beginner: "I will create the LC-MS run manifest and provenance files first."

  lcms_S2_validate_sample_sheet:
    step_id: lcms_S2_validate_sample_sheet
    step_name: Validate LC-MS Sample Sheet
    category: MASS_SPEC_COMMON
    omics: [lcms, metabolomics]
    purpose: Validate LC-MS sample metadata, file paths, sample types, polarity, batch, and injection order.
    module_path: modules/common/validate_lcms_samplesheet/main.nf
    process_name: VALIDATE_LCMS_SAMPLESHEET
    default_tool: python
    fallback_tool: null
    can_run_individually: true
    can_be_skipped: false
    depends_on: []
    optional_depends_on: [lcms_S1_initialize_project]
    compatible_previous_outputs: [lcms_sample_sheet]
    required_inputs:
      - name: sample_sheet
        type: manifest
        formats: [csv, tsv]
        required: true
    outputs:
      - name: validated_samplesheet
        type: tsv
        pattern: "S2_validate_sample_sheet/validated_samplesheet.tsv"
        ui_visible: true
      - name: validation_report
        type: json
        pattern: "S2_validate_sample_sheet/validation_report.json"
        ui_visible: true
      - name: artifact_manifest
        type: json
        pattern: "S2_validate_sample_sheet/artifact_manifest.json"
        ui_visible: true
    parameters:
      polarity:
        type: enum
        choices: [positive, negative]
        default: null
        exposure: user
        ui_label: Polarity
    next_steps:
      recommended: [lcms_S0_convert_or_register_mzml]
      allowed: [lcms_S0_convert_or_register_mzml]
    resources:
      cpus: 1
      memory: 2.GB
      time: 15.m
    containers:
      python: survom/lcms-core:module1-pending
    ui:
      card_title: Validate LC-MS sample sheet
      card_description: Stop on duplicate IDs, missing files, invalid injection order, or mixed polarity.
      mode: automated
      expose_in_guided: true
    chat_guidance:
      beginner: "I will validate the LC-MS sample sheet and stop on unsafe metadata."

  lcms_S0_convert_or_register_mzml:
    step_id: lcms_S0_convert_or_register_mzml
    step_name: Convert or Register mzML
    category: MASS_SPEC_COMMON
    omics: [lcms, metabolomics]
    purpose: Register mzML input or construct audited MSConvert provenance for vendor raw data.
    module_path: modules/common/convert_or_register_mzml/main.nf
    process_name: CONVERT_OR_REGISTER_MZML
    default_tool: passthrough_mzml
    fallback_tool: msconvert
    can_run_individually: true
    can_be_skipped: false
    depends_on: [lcms_S2_validate_sample_sheet]
    optional_depends_on: []
    compatible_previous_outputs: [validated_lcms_samplesheet]
    required_inputs:
      - name: validated_samplesheet
        type: manifest
        formats: [tsv]
        required: true
    outputs:
      - name: conversion_manifest
        type: tsv
        pattern: "S0_convert_or_register_mzml/conversion_manifest.tsv"
        ui_visible: true
      - name: registered_mzml
        type: file
        pattern: "S0_convert_or_register_mzml/converted_or_registered/*.mzML"
        ui_visible: true
      - name: artifact_manifest
        type: json
        pattern: "S0_convert_or_register_mzml/artifact_manifest.json"
        ui_visible: true
    parameters:
      conversion_mode:
        type: enum
        choices: [passthrough_mzml, host_msconvert, docker_msconvert]
        default: passthrough_mzml
        exposure: user
        ui_label: MSConvert mode
      centroiding_policy:
        type: enum
        choices: [require_input_centroided, request_msconvert_centroiding, preserve_input_state]
        default: require_input_centroided
        exposure: user
        ui_label: Centroiding policy
      ms_level_policy:
        type: enum
        choices: [preserve_all, ms1_ms2, ms1_only]
        default: preserve_all
        exposure: user
        ui_label: MS level policy
      host_msconvert_path:
        type: string
        default: null
        exposure: expert
      docker_msconvert_image:
        type: string
        default: null
        exposure: expert
      msconvert_extra_args:
        type: string
        default: null
        exposure: expert
    next_steps:
      recommended: [lcms_S3_register_mzml_inputs]
      allowed: [lcms_S3_register_mzml_inputs]
    resources:
      cpus: 2
      memory: 4.GB
      time: 2.h
    containers:
      python: survom/lcms-core:module1-pending
    ui:
      card_title: Register or convert mzML
      card_description: Preserve raw files and write conversion provenance.
      mode: guided
      expose_in_guided: true
    chat_guidance:
      beginner: "I will register mzML files without changing them, or fail clearly if vendor conversion is requested but unavailable."

  lcms_S3_register_mzml_inputs:
    step_id: lcms_S3_register_mzml_inputs
    step_name: Register mzML Inputs
    category: MASS_SPEC_COMMON
    omics: [lcms, metabolomics]
    purpose: Create the mzML input manifest consumed by inspection and later feature detection.
    module_path: modules/common/register_mzml_inputs/main.nf
    process_name: REGISTER_MZML_INPUTS
    default_tool: python
    fallback_tool: null
    can_run_individually: true
    can_be_skipped: false
    depends_on: [lcms_S0_convert_or_register_mzml]
    optional_depends_on: [lcms_S2_validate_sample_sheet]
    compatible_previous_outputs: [conversion_manifest, validated_lcms_samplesheet]
    required_inputs:
      - name: conversion_manifest
        type: manifest
        formats: [tsv]
        required: true
      - name: validated_samplesheet
        type: manifest
        formats: [tsv]
        required: true
    outputs:
      - name: mzml_input_manifest
        type: tsv
        pattern: "S3_register_mzml_inputs/mzml_input_manifest.tsv"
        ui_visible: true
      - name: artifact_manifest
        type: json
        pattern: "S3_register_mzml_inputs/artifact_manifest.json"
        ui_visible: true
    parameters: {}
    next_steps:
      recommended: [lcms_S4_inspect_mzml]
      allowed: [lcms_S4_inspect_mzml, lcms_S5P_centroid_mzml_peakpicker_hires]
    resources:
      cpus: 1
      memory: 2.GB
      time: 15.m
    containers:
      python: survom/lcms-core:module1-pending
    ui:
      card_title: Register mzML manifest
      card_description: Build the explicit mzML manifest consumed by downstream LC-MS stages.
      mode: automated
      expose_in_guided: true
    chat_guidance:
      beginner: "I will create the mzML manifest used by later LC-MS steps."

  lcms_S4_inspect_mzml:
    step_id: lcms_S4_inspect_mzml
    step_name: Inspect mzML
    category: MASS_SPEC_COMMON
    omics: [lcms, metabolomics]
    purpose: Inspect mzML readability, scan counts, RT range, polarity, and TIC/BPC summaries.
    module_path: modules/common/inspect_mzml/main.nf
    process_name: INSPECT_MZML
    default_tool: pyopenms
    fallback_tool: null
    can_run_individually: true
    can_be_skipped: false
    depends_on: [lcms_S3_register_mzml_inputs]
    optional_depends_on: []
    compatible_previous_outputs: [mzml_input_manifest]
    required_inputs:
      - name: mzml_input_manifest
        type: manifest
        formats: [tsv]
        required: true
    outputs:
      - name: inspection_manifest
        type: tsv
        pattern: "S4_inspect_mzml/inspection_manifest.tsv"
        ui_visible: true
      - name: artifact_manifest
        type: json
        pattern: "S4_inspect_mzml/artifact_manifest.json"
        ui_visible: true
    parameters: {}
    next_steps:
      recommended: [lcms_S5_centroiding_gate]
      allowed: [lcms_S5_centroiding_gate]
    resources:
      cpus: 2
      memory: 8.GB
      time: 1.h
    containers:
      pyopenms: survom/lcms-core:module1-pending
    ui:
      card_title: Inspect mzML
      card_description: Requires pinned pyOpenMS/OpenMS runtime; currently blocked until runtime verification.
      mode: automated
      expose_in_guided: true
    chat_guidance:
      beginner: "I will inspect the mzML only after pyOpenMS/OpenMS is installed and verified."

  lcms_S5_centroiding_gate:
    step_id: lcms_S5_centroiding_gate
    step_name: Centroiding Gate
    category: MASS_SPEC_COMMON
    omics: [lcms, metabolomics]
    purpose: Decide whether input mzML is centroided, profile, unknown, or should be routed to explicit PeakPickerHiRes remediation.
    module_path: modules/common/centroiding_gate/main.nf
    process_name: CENTROIDING_GATE
    default_tool: pyopenms
    fallback_tool: null
    can_run_individually: true
    can_be_skipped: false
    depends_on: [lcms_S4_inspect_mzml]
    optional_depends_on: []
    compatible_previous_outputs: [inspection_manifest]
    required_inputs:
      - name: inspection_manifest
        type: manifest
        formats: [tsv]
        required: true
    outputs:
      - name: centroiding_gate_manifest
        type: tsv
        pattern: "S5_centroiding_gate/centroiding_gate_manifest.tsv"
        ui_visible: true
      - name: artifact_manifest
        type: json
        pattern: "S5_centroiding_gate/artifact_manifest.json"
        ui_visible: true
    parameters: {}
    next_steps:
      recommended: []
      allowed: [lcms_S5P_centroid_mzml_peakpicker_hires]
    resources:
      cpus: 1
      memory: 4.GB
      time: 30.m
    containers:
      pyopenms: survom/lcms-core:module1-pending
    ui:
      card_title: Check centroiding state
      card_description: Stops on profile or unknown data unless explicit remediation is selected.
      mode: automated
      expose_in_guided: true
    chat_guidance:
      beginner: "I will stop if profile data are detected unless centroiding was explicitly approved."

  lcms_S5P_centroid_mzml_peakpicker_hires:
    step_id: lcms_S5P_centroid_mzml_peakpicker_hires
    step_name: Explicit PeakPickerHiRes Centroiding
    category: MASS_SPEC_COMMON
    omics: [lcms, metabolomics]
    purpose: Explicitly centroid profile mzML with PeakPickerHiRes after user approval.
    module_path: modules/common/centroid_mzml_peakpicker_hires/main.nf
    process_name: CENTROID_MZML_PEAKPICKER_HIRES
    default_tool: pyopenms_peakpicker_hires
    fallback_tool: null
    can_run_individually: true
    can_be_skipped: true
    depends_on: [lcms_S3_register_mzml_inputs]
    optional_depends_on: [lcms_S5_centroiding_gate]
    compatible_previous_outputs: [mzml_input_manifest]
    required_inputs:
      - name: mzml_input_manifest
        type: manifest
        formats: [tsv]
        required: true
    outputs:
      - name: centroided_mzml
        type: file
        pattern: "S5P_centroid_mzml_peakpicker_hires/centroided/*.mzML"
        ui_visible: true
      - name: centroiding_report
        type: tsv
        pattern: "S5P_centroid_mzml_peakpicker_hires/centroiding_report.tsv"
        ui_visible: true
      - name: artifact_manifest
        type: json
        pattern: "S5P_centroid_mzml_peakpicker_hires/artifact_manifest.json"
        ui_visible: true
    parameters: {}
    next_steps:
      recommended: [lcms_S4_inspect_mzml]
      allowed: [lcms_S4_inspect_mzml]
    resources:
      cpus: 4
      memory: 16.GB
      time: 2.h
    containers:
      pyopenms: survom/lcms-core:module1-pending
    ui:
      card_title: Explicit centroiding remediation
      card_description: Never runs automatically; requires pyOpenMS/OpenMS verification and user approval.
      mode: expert
      expose_in_guided: true
    chat_guidance:
      beginner: "This step should run only when profile data need explicit approved centroiding."

  lcms_U123_detect_features_per_sample:
    step_id: lcms_U123_detect_features_per_sample
    step_name: Detect Features Per Sample
    category: MASS_SPEC_FEATURE_DETECTION
    omics: [lcms, metabolomics]
    purpose: Run MassTraceDetection, ElutionPeakDetection, and FeatureFindingMetabo as one durable per-sample feature detection process.
    module_path: modules/common/detect_features_per_sample/main.nf
    process_name: DETECT_FEATURES_PER_SAMPLE
    default_tool: pyopenms_feature_finding_metabo
    fallback_tool: null
    can_run_individually: true
    can_be_skipped: false
    depends_on: [lcms_S5_centroiding_gate]
    optional_depends_on: [lcms_S3_register_mzml_inputs]
    compatible_previous_outputs: [mzml_input_manifest, centroiding_gate_manifest]
    required_inputs:
      - name: mzml_input_manifest
        type: manifest
        formats: [tsv]
        required: true
      - name: centroiding_gate_manifest
        type: manifest
        formats: [tsv]
        required: true
    outputs:
      - name: featurexml
        type: file
        pattern: "U123_detect_features_per_sample/featureXML/*.featureXML"
        ui_visible: true
      - name: mass_trace_summary
        type: csv
        pattern: "U123_detect_features_per_sample/mass_trace_summary.csv"
        ui_visible: true
      - name: elution_peak_summary
        type: csv
        pattern: "U123_detect_features_per_sample/elution_peak_summary.csv"
        ui_visible: true
      - name: feature_detection_summary
        type: csv
        pattern: "U123_detect_features_per_sample/feature_detection_summary.csv"
        ui_visible: true
      - name: feature_detection_manifest
        type: tsv
        pattern: "U123_detect_features_per_sample/feature_detection_manifest.tsv"
        ui_visible: true
      - name: artifact_manifest
        type: json
        pattern: "U123_detect_features_per_sample/artifact_manifest.json"
        ui_visible: true
    parameters:
      mass_error_ppm:
        type: float
        default: 10.0
        exposure: user
        ui_label: Mass error ppm
      noise_threshold_int:
        type: float
        default: 1000.0
        exposure: user
        ui_label: Noise threshold intensity
      min_trace_length_s:
        type: float
        default: 5.0
        exposure: user
        ui_label: Minimum trace length, seconds
      quant_method:
        type: enum
        choices: [area, median, max_height]
        default: area
        exposure: user
        ui_label: Mass trace quantification method
      width_filtering:
        type: enum
        choices: ["off", "fixed", "auto"]
        default: "off"
        exposure: user
        ui_label: Elution width filtering
      min_fwhm_s:
        type: float
        default: 1.0
        exposure: user
        ui_label: Minimum FWHM, seconds
      max_fwhm_s:
        type: float
        default: 120.0
        exposure: user
        ui_label: Maximum FWHM, seconds
      expected_chrom_fwhm_s:
        type: float
        default: 10.0
        exposure: user
        ui_label: Expected chromatographic FWHM, seconds
      isotope_filtering_model:
        type: enum
        choices: [none, metabolites]
        default: none
        exposure: user
        ui_label: Isotope filtering model
      charge_lower_bound:
        type: integer
        default: 1
        exposure: user
        ui_label: Minimum charge
      charge_upper_bound:
        type: integer
        default: 1
        exposure: user
        ui_label: Maximum charge
      remove_single_traces:
        type: enum
        choices: ["true", "false"]
        default: "false"
        exposure: user
        ui_label: Remove single-trace features
    next_steps:
      recommended: [lcms_U4_U9_integration_matrix_qc]
      allowed: [lcms_U4_U9_integration_matrix_qc]
    resources:
      cpus: 4
      memory: 16.GB
      time: 2.h
    containers:
      pyopenms: survom/lcms-core:module2-pending
    ui:
      card_title: Detect LC-MS features per sample
      card_description: Runs U1/U2/U3 as logical substages inside one durable FeatureXML-producing process.
      mode: guided
      expose_in_guided: true
    chat_guidance:
      beginner: "I will detect per-sample LC-MS features only after the centroiding gate has passed."

  lcms_U4_U9_integration_matrix_qc:
    step_id: lcms_U4_U9_integration_matrix_qc
    step_name: Integrate Features And Export Matrix QC
    category: MASS_SPEC_FEATURE_MATRIX
    omics: [lcms, metabolomics]
    purpose: Select a reference run, align feature maps, link consensus features, export the raw feature matrix, and write feature/sample QC CSV files.
    module_path: modules/common/integrate_matrix_qc/main.nf
    process_name: INTEGRATE_MATRIX_QC
    default_tool: pyopenms_map_alignment_consensus
    fallback_tool: null
    can_run_individually: true
    can_be_skipped: false
    depends_on: [lcms_U123_detect_features_per_sample]
    optional_depends_on: [lcms_S2_validate_sample_sheet]
    compatible_previous_outputs: [feature_detection_manifest, validated_samplesheet]
    required_inputs:
      - name: feature_detection_manifest
        type: manifest
        formats: [tsv]
        required: true
      - name: validated_samplesheet
        type: manifest
        formats: [tsv]
        required: false
    outputs:
      - name: reference_selection_report
        type: json
        pattern: "U4_U9_integration_matrix_qc/U4_select_reference_run/reference_selection_report.json"
        ui_visible: true
      - name: aligned_feature_manifest
        type: tsv
        pattern: "U4_U9_integration_matrix_qc/U5_align_feature_maps/aligned_feature_manifest.tsv"
        ui_visible: true
      - name: consensus_features
        type: file
        pattern: "U4_U9_integration_matrix_qc/U6_link_consensus_features/linked_features.consensusXML"
        ui_visible: true
      - name: raw_feature_matrix
        type: csv
        pattern: "U4_U9_integration_matrix_qc/U7_export_raw_feature_matrix/raw_feature_matrix.csv"
        ui_visible: true
      - name: feature_metadata
        type: csv
        pattern: "U4_U9_integration_matrix_qc/U7_export_raw_feature_matrix/feature_metadata.csv"
        ui_visible: true
      - name: feature_level_qc
        type: csv
        pattern: "U4_U9_integration_matrix_qc/U8_feature_level_qc/feature_level_qc.csv"
        ui_visible: true
      - name: sample_level_qc
        type: csv
        pattern: "U4_U9_integration_matrix_qc/U9_sample_level_qc/sample_level_qc.csv"
        ui_visible: true
    parameters:
      reference_strategy:
        type: enum
        choices: [most_features, pooled_qc, user_specified]
        default: most_features
        exposure: user
        ui_label: Reference run selection
      reference_sample_id:
        type: string
        default: null
        exposure: expert
        ui_label: Reference sample ID
      link_mz_tolerance_ppm:
        type: float
        default: 20.0
        exposure: user
        ui_label: Feature linking m/z tolerance, ppm
      link_rt_tolerance_s:
        type: float
        default: 30.0
        exposure: user
        ui_label: Feature linking RT tolerance, seconds
    next_steps:
      recommended: []
      allowed: []
    resources:
      cpus: 4
      memory: 16.GB
      time: 2.h
    containers:
      pyopenms: survom/lcms-core:module3-pending
    ui:
      card_title: Integrate LC-MS features and export matrix/QC
      card_description: Writes raw feature matrix and QC CSV files only. No normalization, imputation, annotation, or statistics are performed.
      mode: guided
      expose_in_guided: true
    chat_guidance:
      beginner: "I will align and link detected features, then export a raw matrix and QC tables."

  rnaseq_04_adapter_quality_trimming:
    step_id: rnaseq_04_adapter_quality_trimming
    step_name: Adapter and Quality Trimming
    category: COMMON
    omics: [rnaseq, genomics, atacseq, chipseq, methylation]
    purpose: Remove adapters, poor-quality read tails, and platform-specific artifacts before mapping or quantification.
    module_path: modules/common/fastp/main.nf
    process_name: FASTP
    default_tool: fastp
    fallback_tool: cutadapt
    can_run_individually: true
    can_be_skipped: true
    skip_conditions:
      - raw QC shows no adapter contamination and high read quality
      - expert user explicitly selects no trimming
    depends_on:
      - rnaseq_03_raw_read_qc
    optional_depends_on:
      - rnaseq_02_fastq_staging_integrity
    compatible_previous_outputs:
      - staged_fastq_manifest
      - fastqc_html
      - fastqc_zip
      - raw_fastq_files
    required_inputs:
      - name: fastq_manifest
        type: manifest
        formats: [csv, tsv, json]
        required: true
      - name: fastq_1
        type: file
        formats: [fastq, fastq.gz, fq, fq.gz]
        required: true
      - name: fastq_2
        type: file
        formats: [fastq, fastq.gz, fq, fq.gz]
        required_when: library_layout == paired
    outputs:
      - name: trimmed_fastq_manifest
        type: tsv
        pattern: "04_trimmed/trimmed_fastq_manifest.tsv"
        ui_visible: true
      - name: trim_manifest
        type: tsv
        pattern: "04_trimmed/trim_manifest.tsv"
        ui_visible: true
      - name: trimmed_fastq
        type: file
        pattern: "04_trimmed/*.trimmed.fastq.gz"
        ui_visible: true
      - name: trimming_html
        type: file
        pattern: "04_trimmed/*.fastp.html"
        ui_visible: true
      - name: trimming_json
        type: json
        pattern: "04_trimmed/*.fastp.json"
        ui_visible: true
    parameters:
      run_trimming:
        type: boolean
        default: true
        exposure: user
        ui_label: Run adapter and quality trimming
      trimming_tool:
        type: enum
        choices: [fastp, cutadapt]
        default: fastp
        exposure: expert
        ui_label: Trimming tool
      quality_threshold:
        type: integer
        default: 20
        min: 5
        max: 35
        exposure: user
        ui_label: Minimum base quality
      minimum_read_length:
        type: integer
        default: 20
        min: 10
        max: 100
        exposure: user
        ui_label: Minimum read length after trimming
      trim_poly_g:
        type: enum
        choices: [auto, true, false]
        default: auto
        exposure: user
        ui_label: Trim polyG tails
      trim_poly_x:
        type: boolean
        default: false
        exposure: user
        ui_label: Trim polyX tails
      adapter_sequence_r1:
        type: string
        default: null
        exposure: expert
      adapter_sequence_r2:
        type: string
        default: null
        exposure: expert
      adapter_fasta:
        type: string
        default: null
        exposure: expert
      trim_front_r1:
        type: integer
        default: 0
        min: 0
        max: 50
        exposure: expert
      trim_front_r2:
        type: integer
        default: 0
        min: 0
        max: 50
        exposure: expert
      detect_adapter_for_pe:
        type: boolean
        default: true
        exposure: internal
      cutadapt_error_rate:
        type: float
        default: 0.1
        min: 0
        max: 0.3
        exposure: expert
      cutadapt_minimum_overlap:
        type: integer
        default: 3
        min: 1
        max: 20
        exposure: expert
      threads:
        type: integer
        default: 4
        exposure: internal
    next_steps:
      recommended:
        - rnaseq_05_post_trim_quality_control
      allowed:
        - rnaseq_05_post_trim_quality_control
        - rnaseq_06_strandedness_inference
        - rnaseq_07_salmon_quantification
        - rnaseq_09_star_alignment
    resources:
      cpus: 4
      memory: 8.GB
      time: 4.h
    containers:
      fastp: quay.io/biocontainers/fastp:0.23.4--h5f740d0_0
      cutadapt: quay.io/biocontainers/cutadapt:5.1--py312h0fa9677_0
    ui:
      card_title: Trim adapters and low-quality reads
      card_description: Clean reads before alignment or quantification.
      mode: configurable
      expose_in_guided: true
    chat_guidance:
      beginner: "I recommend fastp with Q20, minimum length 20, and automatic polyG handling."
      expert: "Use Cutadapt only when exact adapter grammar or older-study reproducibility is required."

  rnaseq_05_post_trim_quality_control:
