        pattern: "05_post_trim_qc/fastqc/*_fastqc.zip"
        ui_visible: true
      - name: post_trim_qc_manifest
        type: tsv
        pattern: "05_post_trim_qc/fastqc/*.post_trim_qc_manifest.tsv"
        ui_visible: true
      - name: post_trim_qc_versions
