  rnaseq_06_strandedness_inference:
    step_id: rnaseq_06_strandedness_inference
    step_name: Strandedness Inference
    category: RNA_SEQ_SPECIFIC
    omics: [rnaseq]
    purpose: Infer RNA-seq library strandedness from trimmed FASTQ before downstream quantification or alignment.
    module_path: modules/rnaseq/salmon_strandedness_infer/main.nf
    process_name: SALMON_STRANDEDNESS_INFERENCE
    default_tool: salmon_auto
    fallback_tool: rseqc_infer_experiment
    can_run_individually: true
    can_be_skipped: false
    depends_on:
      - rnaseq_06a_reference_build_validation
    optional_depends_on:
      - rnaseq_04_adapter_quality_trimming
    compatible_previous_outputs:
      - trimmed_fastq_manifest
      - trimmed_fastq
    required_inputs:
      - name: trimmed_fastq
        type: file
        formats: [fastq.gz, fq.gz]
        required: true
      - name: salmon_index
        type: directory
        formats: [salmon_index]
        required_when: strandedness_method == salmon_auto
      - name: rseqc_ref_bed
        type: file
        formats: [bed]
        required_when: strandedness_method == rseqc_validation
      - name: star_index
        type: directory
        formats: [star_index]
        required_when: strandedness_method == rseqc_validation and existing_bam is empty
    outputs:
      - name: strandedness_call
        type: json
        pattern: "06_strandedness/*.strandedness_call.json"
        ui_visible: true
      - name: strandedness_evidence
        type: tsv
        pattern: "06_strandedness/*.strandedness_evidence.tsv"
        ui_visible: true
      - name: salmon_inference_log
        type: log
        pattern: "06_strandedness/*.salmon_inference.log"
        ui_visible: true
      - name: strandness_manifest
        type: tsv
        pattern: "06_strandedness/*.strandness_manifest.tsv"
        ui_visible: true
    parameters:
      strandedness_method:
        type: enum
        choices: [salmon_auto, rseqc_validation]
        default: salmon_auto
        exposure: user
        ui_label: Strandedness inference method
      salmon_index:
        type: string
        default: null
        exposure: user
        ui_label: Salmon transcriptome index
      existing_bam:
        type: string
        default: null
        exposure: expert
        ui_label: Existing sorted BAM for RSeQC validation
      star_index:
        type: string
        default: null
        exposure: expert
        ui_label: STAR genome index for RSeQC fallback
      rseqc_ref_bed:
        type: string
        default: null
        exposure: expert
        ui_label: RSeQC BED annotation
      rseqc_stranded_threshold:
        type: float
        default: 0.6
        min: 0.5
        max: 0.95
        exposure: expert
        ui_label: RSeQC strandedness threshold
      strandedness_inference_reads:
        type: integer
        default: 1000000
        min: 10000
        max: 5000000
        exposure: expert
        ui_label: Reads sampled for Salmon inference
      inferred_library_type:
        type: string
        default: null
        exposure: internal
        ui_label: Inferred Salmon library type
      strandedness_approval_status:
        type: enum
        choices: [pending, approved, overridden, needs_review]
        default: pending
        exposure: internal
        ui_label: Strandedness approval status
    next_steps:
      recommended:
        - rnaseq_07_salmon_quantification
      allowed:
        - rnaseq_07_salmon_quantification
        - rnaseq_09_star_alignment
    resources:
      cpus: 4
      memory: 8.GB
      time: 2.h
    containers:
      salmon: quay.io/biocontainers/salmon:1.10.3--h6dccd9a_2
      star: quay.io/biocontainers/star:2.7.11b--h5ca1c30_8
      rseqc: quay.io/biocontainers/rseqc:5.0.4--pyhdfd78af_1
    ui:
      card_title: Infer strandedness
      card_description: Default path uses Salmon automatic library type detection on trimmed FASTQ. RSeQC is fallback validation only.
      mode: configurable
      expose_in_guided: true
      status_values: [pending, running, completed, ambiguous, failed]
    chat_guidance:
      beginner: "I will infer library strandedness with Salmon -l A from trimmed FASTQ before quantification."
      expert: "Use RSeQC infer_experiment.py only when a BAM already exists, Salmon is ambiguous, or alignment-based validation is explicitly requested."

